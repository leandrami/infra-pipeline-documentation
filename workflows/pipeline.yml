name: Pipeline CI/CD - Projeto Observabilidade

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

stages:
  - security
  - build
  - quality
  - test

jobs:
  # 1. SAST e Análise de Dependências (Shift-Left)
  sast-security:
    stage: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Executar Análise Estática de Segurança (SAST)
        run: echo "Executando varredura de vulnerabilidades estáticas..."
        # Aqui entraria a ferramenta de SAST (ex: njsscan, SonarQube)

  # 2. Build / Compilação
  build-app:
    stage: build
    needs: sast-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Instalar dependências e Compilar
        run: |
          npm ci
          npx prisma generate
          npm run build
      - name: Salvar artefato de build
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: dist/

  # 3. Lint & Quality (Roda em paralelo após o build)
  lint-quality:
    stage: quality
    needs: [build-app]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Instalar dependências
        run: npm ci
      - name: Executar Lint e Qualidade
        run: npm run lint

  # 4. Testes Unitários e de Integração
  test-unit:
    stage: test
    needs: [build-app]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - name: Instalar dependências
        run: npm ci
      - name: Executar Testes Automatizados
        run: npm test